<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق المزرعة - بيع وشراء</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 15px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #2e7d32; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .product { background: white; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-top: 20px; position: relative; text-align: right; }
        .product img { width: 100%; border-radius: 10px; height: 200px; object-fit: cover; }
        .wa-btn { display: block; background: #25D366; color: white; text-decoration: none; padding: 12px; border-radius: 10px; margin-top: 10px; font-weight: bold; text-align: center; }
        .del-btn { position: absolute; top: 10px; left: 10px; background: rgba(255,0,0,0.6); color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>🐣 سوق المزرعة</h1>
    <p>انشر عرضك ليشاهده الجميع فوراً</p>
    <input type="text" id="pName" placeholder="اسم المنتج">
    <input type="number" id="pPrice" placeholder="السعر بالدينار">
    <input type="tel" id="pPhone" placeholder="رقم واتسابك (216xxxxxxx)">
    <input type="password" id="pPass" placeholder="اختر كلمة سر لحماية إعلانك">
    <input type="file" id="pImg" accept="image/*">
    <button onclick="publish()">نشر العرض الآن</button>
</div>

<div id="market" style="max-width: 400px; margin: auto;"></div>

<script>
    // ربط قاعدة البيانات برابطك الخاص
    const firebaseConfig = {
        databaseURL: "https://sou9-c7e27-default-rtdb.firebaseio.com/" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("products");

    function publish() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const phone = document.getElementById('pPhone').value;
        const pass = document.getElementById('pPass').value;
        const file = document.getElementById('pImg').files[0];

        if (file && name && phone && pass) {
            const reader = new FileReader();
            reader.onload = function(e) {
                db.push({ name, price, phone, pass, img: e.target.result });
                alert("تم النشر بنجاح! احتفظ بكلمة سرك للحذف.");
                document.getElementById('pName').value = "";
                document.getElementById('pPrice').value = "";
                document.getElementById('pPass').value = "";
            };
            reader.readAsDataURL(file);
        } else {
            alert("يرجى ملء جميع الخانات واختيار كلمة سر");
        }
    }

    db.on("value", (snapshot) => {
        const market = document.getElementById('market');
        market.innerHTML = "";
        snapshot.forEach((child) => {
            const p = child.val();
            market.innerHTML += `
                <div class="product">
                    <button class="del-btn" onclick="remove('${child.key}', '${p.pass}')">×</button>
                    <img src="${p.img}">
                    <h3>${p.name}</h3>
                    <p>السعر: ${p.price} د</p>
                    <a href="https://wa.me/${p.phone}?text=أريد شراء ${p.name}" class="wa-btn">واتساب ✅</a>
                </div>`;
        });
    });

    function remove(id, correctPass) {
        const userPass = prompt("أدخل كلمة السر التي اخترتها لهذا الإعلان لحذفه:");
        if (userPass === correctPass) {
            db.child(id).remove();
            alert("تم حذف الإعلان.");
        } else if (userPass !== null) {
            alert("كلمة سر خاطئة!");
        }
    }
</script>
</body>
</html>
